<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เครื่องคำนวณปริมาตรน้ำในสระ</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap');

    :root {
      --navy: #1d3b6d;
      --navy-dark: #152f59;
      --orange: #f27a45;
      --line: #dfe5eb;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      background: var(--navy);
    }

    .pool-calc-wrapper {
      display: flex;
      width: 100%;
      overflow: hidden;
      box-sizing: border-box;
      font-family: 'Prompt', sans-serif;
      background: linear-gradient(135deg, #244a85 0%, #1b396d 100%);
    }

    .calc-left,
    .calc-right {
      width: 50%;
      min-width: 0;
      box-sizing: border-box;
      padding: 20px;
    }

    .calc-left {
      background: rgba(20, 55, 108, .32);
    }

    .calc-right {
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      background: rgba(15, 45, 92, .26);
      border-left: 1px solid rgba(255, 255, 255, .28);
    }

    .calc-title {
      margin: -20px -20px 18px;
      padding: 12px 20px;
      color: #fff;
      font-size: 26px;
      font-weight: 700;
      text-align: center;
      letter-spacing: .1px;
      background: rgba(13, 42, 87, .62);
      border-bottom: 1px solid rgba(255, 255, 255, .12);
    }

    .input-group {
      margin-bottom: 14px;
    }

    .input-group label {
      display: block;
      margin-bottom: 6px;
      color: #f9fbff;
      font-size: 15px;
      font-weight: 600;
    }

    .input-group input,
    .input-group select {
      width: 100%;
      height: 50px;
      box-sizing: border-box;
      padding: 10px 22px;
      color: #2e3440;
      font-family: 'Prompt', sans-serif;
      font-size: 17px;
      background: #fff;
      border: 2px solid var(--line);
      border-radius: 12px;
      box-shadow: 0 3px 8px rgba(7, 24, 55, .16);
    }

    .input-group input:focus,
    .input-group select:focus {
      outline: none;
      border-color: #f58b5f;
      box-shadow: 0 0 0 3px rgba(245, 139, 95, .22);
    }

    .calc-btn {
      width: 100%;
      margin-top: 2px;
      padding: 13px 20px;
      color: #fff;
      font-family: 'Prompt', sans-serif;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      background: linear-gradient(135deg, #ff8b4a 0%, #f26f3c 100%);
      border: 0;
      border-radius: 10px;
      box-shadow: 0 5px 12px rgba(11, 29, 60, .24);
      transition: transform .2s ease, box-shadow .2s ease;
    }

    .calc-btn:hover {
      box-shadow: 0 7px 16px rgba(11, 29, 60, .3);
      transform: translateY(-1px);
    }

    .result-box {
      box-sizing: border-box;
      margin-bottom: 14px;
      padding: 18px 20px;
      text-align: center;
      background: linear-gradient(135deg, #ffb58c 0%, #f79c6f 100%);
      border: 1px solid #ffc5a4;
      border-radius: 18px;
      box-shadow: 0 6px 14px rgba(10, 29, 63, .17);
    }

    .result-label {
      margin-bottom: 6px;
      color: #fff;
      font-size: 16px;
      font-weight: 600;
    }

    .result-value {
      color: #fff;
      font-size: 28px;
      font-weight: 700;
    }

    .result-highlight {
      font-size: 32px;
    }

    #res-liters,
    #res-sub {
      font-size: 16px !important;
    }

    .result-box.recommendation {
      margin-bottom: 0;
      background: linear-gradient(135deg, #f2763d 0%, #d95428 100%);
      border: 1px solid #ff9a70;
    }

    .note {
      margin: 14px 0 0;
      color: rgba(255, 255, 255, .92);
      font-size: 13px;
      font-weight: 500;
      line-height: 1.5;
      text-align: center;
    }

    @media (max-width: 700px) {
      .pool-calc-wrapper {
        display: flex;
      }

      .calc-left,
      .calc-right {
        width: 50%;
        padding: 8px 7px;
      }

      .calc-right {
        border-left: 1px solid rgba(255, 255, 255, .28);
      }

      .calc-title {
        margin: -8px -7px 7px;
        padding: 6px 4px;
        font-size: 15px;
        line-height: 1.4;
      }

      .input-group {
        margin-bottom: 6px;
      }

      .input-group label {
        margin-bottom: 3px;
        font-size: 11px;
        line-height: 1.25;
      }

      .input-group input,
      .input-group select {
        height: 38px;
        padding: 6px 8px;
        font-size: 12px;
        border-radius: 8px;
      }

      .input-group select {
        text-overflow: ellipsis;
      }

      .calc-btn {
        padding: 10px 4px;
        font-size: 11px;
        line-height: 1.25;
        white-space: nowrap;
        border-radius: 8px;
      }

      .result-box {
        margin-bottom: 8px;
        padding: 10px 5px;
        border-radius: 10px;
      }

      .result-label {
        margin-bottom: 3px;
        font-size: 10px;
        line-height: 1.25;
      }

      .result-value {
        font-size: 21px;
      }

      .result-highlight {
        font-size: 23px;
      }

      #res-liters,
      #res-sub {
        font-size: 11px !important;
      }

      .note {
        margin-top: 8px;
        font-size: 9px;
        line-height: 1.35;
      }
    }

    @media (max-width: 380px) {
      .calc-title {
        font-size: 13px;
      }

      .input-group label {
        font-size: 10px;
      }

      .input-group input,
      .input-group select {
        font-size: 11px;
      }

      .calc-btn {
        font-size: 10px;
      }
    }
  </style>
</head>

<body>
  <div class="pool-calc-wrapper">
    <div class="calc-left">
      <h3 class="calc-title">คำนวณปริมาตรน้ำในสระ</h3>

      <div class="input-group">
        <label>เลือกสินค้าที่ต้องการใช้งาน</label>
        <select id="product-type" onchange="calculatePool(false)">
          <option value="powder">คลอรีนผง 90% (Pool Clear)</option>
          <option value="granule">คลอรีนเกล็ด 90% (Pool Clear Granules)</option>
          <option value="tablet">คลอรีนเม็ดฟู่ 15g (Pool Clear Tablets)</option>
          <option value="ph_plus">ผลิตภัณฑ์ปรับค่า pH+ (พีเอชพลัส)</option>
          <option value="ph_minus">ผลิตภัณฑ์ปรับค่า pH- (พีเอชดาวน์)</option>
          <option value="algae">น้ำยากำจัดตะไคร่น้ำ (Algae Clear)</option>
          <option value="crystal">น้ำยาปรับใส (Crystal Clear)</option>
        </select>
      </div>

      <div class="input-group">
        <label>ความกว้าง (เมตร)</label>
        <input type="number" id="pool-w" placeholder="0.00" min="0" step="any" oninput="calculatePool(false)">
      </div>

      <div class="input-group">
        <label>ความยาว (เมตร)</label>
        <input type="number" id="pool-l" placeholder="0.00" min="0" step="any" oninput="calculatePool(false)">
      </div>

      <div class="input-group">
        <label>ความลึกเฉลี่ย (เมตร)</label>
        <input type="number" id="pool-d" placeholder="0.00" min="0" step="any" oninput="calculatePool(false)">
      </div>

      <button class="calc-btn" onclick="calculatePool(true)">
        คำนวณปริมาณที่ต้องใช้
      </button>
    </div>

    <div class="calc-right">
      <h3 class="calc-title">ปริมาณที่แนะนำ</h3>

      <div class="result-box">
        <div class="result-label">ปริมาตรน้ำในสระของคุณคือ</div>
        <div class="result-value" id="res-volume">- คิว</div>
        <div style="font-size:18px;color:#fff;opacity:.8;margin-top:2px" id="res-liters">
          (- ลิตร)
        </div>
      </div>

      <div class="result-box recommendation">
        <div class="result-label" id="product-label">ปริมาณคลอรีนผงที่ต้องใช้</div>
        <div class="result-value result-highlight" id="res-main">-</div>
        <div style="font-size:18px;margin-top:2px;font-weight:500" id="res-sub">
          (-)
        </div>
      </div>

      <div class="note" id="res-note">
        *กรุณากรอกข้อมูลและกดคำนวณ
      </div>
    </div>
  </div>

  <script>

      return value.toLocaleString(undefined, {
        maximumFractionDigits: 2
      });
    }

        }
        return;
      }

        ],
        tablet: [
          'จำนวนคลอรีนเม็ดฟู่ที่ต้องใช้',
          `${format(volume / 2)} เม็ด`,
          `(น้ำหนักรวม ${format(volume * 7.5)} กรัม)`,
          '*อัตราส่วนอ้างอิง: 1 เม็ด (15 กรัม) ต่อ น้ำ 2 คิว'
        ],
        ph_plus: [
          'ปริมาณ pH+ (พีเอชพลัส) ที่ต้องใช้',
          `${format(volume * 10)} กรัม`,
          `(หรือประมาณ ${format(volume * 2)} ช้อนชา)`,
