<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: 'Prompt', sans-serif;
    }

    .pool-calc-wrapper {
      display: flex;
      width: 100%;
      box-sizing: border-box;

      /* ห้ามใส่ min-height: 100vh หรือ 100dvh */
      /* กล่องจะสูงเท่ากับเนื้อหาจริง */
    }

    @media (max-width: 700px) {
      .pool-calc-wrapper {
        display: flex;
      }
    }
  </style>
</head>

<body>
  <div class="pool-calc-wrapper">
    <!-- โค้ดเครื่องคำนวณทั้งหมดของคุณ -->
  </div>
</body>
</html>
