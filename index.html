<style>
  @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap');

  :root {
    --navy: #1d3b6d;
    --navy-dark: #152f59;
    --orange: #f27a45;
    --blue: #367fca;
    --line: #dfe5eb;
    --soft-blue: #edf8ff;
  }

  html,
  body {
    min-height: 100%;
    margin: 0;
  }

  body {
    background: var(--navy);
  }

  .elementor-widget:has(.pool-calc-wrapper),
  .elementor-widget-container:has(.pool-calc-wrapper),
  .elementor-element:has(.pool-calc-wrapper) {
    height: fit-content !important;
    min-height: 0 !important;
    align-self: flex-start !important;
    margin-bottom: 0 !important;
    padding-bottom: 0 !important;
  }

  .pool-calc-wrapper {
    display: flex;
    width: 100%;
    overflow: hidden;
    box-sizing: border-box;
    font-family: 'Prompt', sans-serif;
    background: var(--navy);
    border: 0;
    border-radius: 0;
  }

  .calc-left,
  .calc-right {
    width: 50%;
    min-width: 0;
    box-sizing: border-box;
    padding: 12px 28px;
  }

  .calc-left {
    background: var(--navy);
  }

  .calc-right {
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    background: var(--navy);
    border-left: 1px solid rgba(255, 255, 255, .28);
  }

  .calc-title {
    margin: -12px -28px 10px;
    padding: 8px 18px;
    color: #fff;
    font-size: 18px;
    font-weight: 700;
    text-align: center;
    background: var(--navy-dark);
  }

  .input-group {
    margin-bottom: 8px;
  }

  .input-group label {
    display: block;
    margin-bottom: 4px;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
  }

  .input-group input,
  .input-group select {
    width: 100%;
    height: 45px;
    box-sizing: border-box;
    padding: 8px 20px;
    color: #2e3440;
    font-family: 'Prompt', sans-serif;
    font-size: 16px;
    background: #fff;
    border: 2px solid var(--line);
    border-radius: 12px;
  }

  .input-group input:focus,
  .input-group select:focus {
    outline: none;
    border-color: var(--navy);
  }

  .calc-btn {
    width: 100%;
    margin-top: 0;
    padding: 10px 20px;
    color: #fff;
    font-family: 'Prompt', sans-serif;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    background: var(--orange);
    border: 0;
    border-radius: 10px;
    transition: background .2s ease;
  }

  .calc-btn:hover {
    background: #df6635;
  }

  .result-box {
    box-sizing: border-box;
    margin-bottom: 10px;
    padding: 12px 18px;
    text-align: center;
    background: #f7a97d;
    border: 1px solid #ffc5a4;
    border-radius: 16px;
  }

  .result-label {
    margin-bottom: 4px;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
  }

  .result-value {
    color: #fff;
    font-size: 25px;
    font-weight: 700;
  }

  .result-highlight {
    color: #fff;
    font-size: 28px;
  }

  #res-liters,
  #res-sub {
    font-size: 14px !important;
  }

  .result-box.recommendation {
    margin-bottom: 0;
    background: #df6635;
    border: 1px solid #f58b5f;
  }

  .recommendation .result-label,
  .recommendation #res-sub {
    color: #fff !important;
  }

  .note {
    margin: 10px 0 0;
    color: #fff;
    font-size: 11px;
    font-weight: 500;
    line-height: 1.5;
    text-align: center;
  }

  @media (max-width: 700px) {
    .pool-calc-wrapper {
      display: flex;
      border-radius: 0;
    }

    .calc-left,
    .calc-right {
      width: 50%;
      padding: 8px 7px;
    }

    .calc-right {
      border-top: 0;
      border-left: 1px solid rgba(255, 255, 255, .28);
    }

    .calc-title {
      margin: -8px -7px 7px;
      padding: 6px 4px;
      font-size: 12px;
      line-height: 1.4;
    }

    .input-group {
      margin-bottom: 6px;
    }

    .input-group label {
      margin-bottom: 3px;
      font-size: 11px;
      line-height: 1.25;
    }

    .input-group input,
    .input-group select {
      height: 38px;
      padding: 6px 8px;
      font-size: 12px;
      border-radius: 8px;
    }

    .input-group select {
      text-overflow: ellipsis;
    }

    .calc-btn {
      padding: 10px 4px;
      font-size: 11px;
      line-height: 1.25;
      white-space: nowrap;
      border-radius: 8px;
    }

    .result-box {
      margin-bottom: 8px;
      padding: 10px 5px;
      border-radius: 10px;
    }

    .result-label {
      margin-bottom: 3px;
      font-size: 10px;
      line-height: 1.25;
    }

    .result-value {
      font-size: 21px;
    }

    .result-highlight {
      font-size: 23px;
    }

    #res-liters,
    #res-sub {
      font-size: 11px !important;
    }

    .note {
      margin-top: 8px;
      font-size: 9px;
      line-height: 1.35;
    }
  }

  @media (max-width: 380px) {
    .calc-title {
      font-size: 11px;
    }

    .input-group label {
      font-size: 10px;
    }

    .input-group input,
    .input-group select {
      font-size: 11px;
    }

    .calc-btn {
      font-size: 10px;
    }
  }
</style>

<div class="pool-calc-wrapper">
  <div class="calc-left">
    <h3 class="calc-title">คำนวณปริมาตรน้ำในสระ</h3>

    <div class="input-group">
      <label>เลือกสินค้าที่ต้องการใช้งาน</label>
      <select id="product-type" onchange="calculatePool(false)">
        <option value="powder">คลอรีนผง 90% (Pool Clear)</option>
        <option value="granule">คลอรีนเกล็ด 90% (Pool Clear Granules)</option>
        <option value="tablet">คลอรีนเม็ดฟู่ 15g (Pool Clear Tablets)</option>
        <option value="ph_plus">ผลิตภัณฑ์ปรับค่า pH+ (พีเอชพลัส)</option>
        <option value="ph_minus">ผลิตภัณฑ์ปรับค่า pH- (พีเอชดาวน์)</option>
        <option value="algae">น้ำยากำจัดตะไคร่น้ำ (Algae Clear)</option>
        <option value="crystal">น้ำยาปรับใส (Crystal Clear)</option>
      </select>
    </div>

    <div class="input-group">
      <label>ความกว้าง (เมตร)</label>
      <input type="number" id="pool-w" placeholder="0.00" min="0" step="any" oninput="calculatePool(false)">
    </div>

    <div class="input-group">
      <label>ความยาว (เมตร)</label>
      <input type="number" id="pool-l" placeholder="0.00" min="0" step="any" oninput="calculatePool(false)">
    </div>

    <div class="input-group">
      <label>ความลึกเฉลี่ย (เมตร)</label>
      <input type="number" id="pool-d" placeholder="0.00" min="0" step="any" oninput="calculatePool(false)">
    </div>

    <button class="calc-btn" onclick="calculatePool(true)">
      คำนวณปริมาณที่ต้องใช้
    </button>
  </div>

  <div class="calc-right">
    <h3 class="calc-title">ปริมาณที่แนะนำ</h3>

    <div class="result-box">
      <div class="result-label">ปริมาตรน้ำในสระของคุณคือ</div>
      <div class="result-value" id="res-volume">- คิว</div>
      <div style="font-size:18px;color:#fff;opacity:.8;margin-top:2px" id="res-liters">
        (- ลิตร)
      </div>
    </div>

    <div class="result-box recommendation">
      <div class="result-label" id="product-label">ปริมาณคลอรีนผงที่ต้องใช้</div>
      <div class="result-value result-highlight" id="res-main">-</div>
      <div style="font-size:18px;margin-top:2px;font-weight:500" id="res-sub">
        (-)
      </div>
    </div>

    <div class="note" id="res-note">
      *กรุณากรอกข้อมูลและกดคำนวณ
    </div>
  </div>
</div>

<script>
  function format(value) {
    return value.toLocaleString(undefined, {
      maximumFractionDigits: 2
    });
  }

  function calculatePool(showError = true) {
    const w = parseFloat(document.getElementById('pool-w').value);
    const l = parseFloat(document.getElementById('pool-l').value);
    const d = parseFloat(document.getElementById('pool-d').value);
    const product = document.getElementById('product-type').value;

    if (!(w > 0 && l > 0 && d > 0)) {
      if (showError) {
        alert('กรุณากรอกตัวเลขความกว้าง ความยาว และความลึกให้ถูกต้องครับ');
      }
      return;
    }

    const volume = w * l * d;
    const liters = volume * 1000;

    const products = {
      powder: [
        'ปริมาณคลอรีนผงที่ต้องใช้',
        `${format(volume * 5)} กรัม`,
        `(หรือประมาณ ${format(volume)} ช้อนชา)`,
        '*อัตราส่วนอ้างอิง: คลอรีนผง 5 กรัม (1 ช้อนชา) ต่อ น้ำ 1 คิว'
      ],
      granule: [
        'ปริมาณคลอรีนเกล็ดที่ต้องใช้',
        `${format(volume * 5)} กรัม`,
        `(หรือประมาณ ${format(volume)} ช้อนชา)`,
        '*อัตราส่วนอ้างอิง: คลอรีนเกล็ด 5 กรัม (1 ช้อนชา) ต่อ น้ำ 1 คิว'
      ],
      tablet: [
        'จำนวนคลอรีนเม็ดฟู่ที่ต้องใช้',
        `${format(volume / 2)} เม็ด`,
        `(น้ำหนักรวม ${format(volume * 7.5)} กรัม)`,
        '*อัตราส่วนอ้างอิง: 1 เม็ด (15 กรัม) ต่อ น้ำ 2 คิว'
      ],
      ph_plus: [
        'ปริมาณ pH+ (พีเอชพลัส) ที่ต้องใช้',
        `${format(volume * 10)} กรัม`,
        `(หรือประมาณ ${format(volume * 2)} ช้อนชา)`,
        '*อัตราส่วนอ้างอิง: 10 กรัม (2 ช้อนชา) ต่อ น้ำ 1 คิว'
      ],
      ph_minus: [
        'ปริมาณ pH- (พีเอชดาวน์) ที่ต้องใช้',
        `${format(volume * 10)} กรัม`,
        `(หรือประมาณ ${format(volume * 2)} ช้อนชา)`,
        '*อัตราส่วนอ้างอิง: 10 กรัม (2 ช้อนชา) ต่อ น้ำ 1 คิว'
      ],
      algae: [
        'ปริมาณน้ำยากำจัดตะไคร่น้ำที่ต้องใช้',
        `${format(volume * 1.5)} ml`,
        `(หรือประมาณ ${format(volume / 10)} ฝา)`,
        '*อัตราส่วนอ้างอิง: 1 ฝา (15 ml) ต่อ น้ำ 10 คิว'
      ],
      crystal: [
        'ปริมาณน้ำยาปรับใสที่ต้องใช้',
        `${format(volume * 1.5)} ml`,
        `(หรือประมาณ ${format(volume / 10)} ฝา)`,
        '*อัตราส่วนอ้างอิง: 1 ฝา (15 ml) ต่อ น้ำ 10 คิว'
      ]
    };

    const [label, main, sub, note] = products[product];

    document.getElementById('res-volume').innerText = `${format(volume)} คิว`;
    document.getElementById('res-liters').innerText = `(${format(liters)} ลิตร)`;
    document.getElementById('product-label').innerText = label;
    document.getElementById('res-main').innerText = main;
    document.getElementById('res-sub').innerText = sub;
    document.getElementById('res-note').innerText = note;
  }
  (() => {
  const sendHeight = () => {
    const height = Math.max(
      document.body.scrollHeight,
      document.documentElement.scrollHeight
    );

    window.parent.postMessage(
      { type: 'pool-calculator-resize', height },
      '*'
    );
  };

  window.addEventListener('load', () => setTimeout(sendHeight, 0));
  window.addEventListener('resize', sendHeight);
  new ResizeObserver(sendHeight).observe(document.body);
})();
</script>
